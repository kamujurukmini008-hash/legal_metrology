{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="card authbox">
    <h2 style="margin-top:0">Create account</h2>
    <p class="muted">Sign up to scan labels and save your history.</p>
    {% if error %}<p class="fail">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Name</label>
      <input type="text" name="name" value="{{ name }}" required>
      <label>Email</label>
      <input type="email" name="email" value="{{ email }}" required>
      <label>Password (at least 6 characters)</label>
      <input type="password" name="password" required>
      <label>Confirm password</label>
      <input type="password" name="confirm" required>
      <button class="btn" type="submit" style="margin-top:14px">Sign up</button>
    </form>
    <p class="note">Already have an account? <a href="/login">Login</a></p>
  </div>
</div>
{% endblock %}
