<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LegalCheck | Packaged Commodities Compliance</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a class="brand" href="/"><img src="{{ url_for('static', filename='logo.svg') }}" alt="logo">LegalCheck</a>
    <div class="links">
      <a href="/" class="{{ 'active' if request.path == '/' }}">Home</a>
      <a href="/scanner" class="{{ 'active' if request.path == '/scanner' }}">Scanner</a>
      <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' }}">Dashboard</a>
      <a href="/history" class="{{ 'active' if request.path == '/history' }}">History</a>
      {% if user_name %}
      <span class="who">Hi, {{ user_name }}</span>
      <a href="/logout">Logout</a>
      {% else %}
      <a href="/login" class="{{ 'active' if request.path == '/login' }}">Login</a>
      <a href="/signup" class="{{ 'active' if request.path == '/signup' }}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  {% block content %}{% endblock %}
  <footer>Legal Metrology Compliance Checker &middot; MLRIT Micro Project</footer>
</body>
</html>
