{% extends "base.html" %}
{% block content %}
<div class="container">
  <div class="card authbox">
    <h2 style="margin-top:0">Login</h2>
    <p class="muted">Welcome back! Log in to use the scanner.</p>
    {% if error %}<p class="fail">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email</label>
      <input type="email" name="email" value="{{ email }}" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button class="btn" type="submit" style="margin-top:14px">Login</button>
    </form>
    <p class="note">New here? <a href="/signup">Create an account</a></p>
  </div>
</div>
{% endblock %}
